// logiops config for the Logitech MX Master 3S on GNOME (Ubuntu).
// Thumb (gesture) button behaves like a macOS trackpad swipe:
//   hold + move left  -> next workspace
//   hold + move right -> previous workspace
//   tap / up / down   -> Activities overview (like Mission Control)

devices: (
{
    // Bolt receiver and Bluetooth usually report "MX Master 3S".
    // The business edition can report "MX Master 3S B" (see README).
    name: "MX Master 3S";

    smartshift: { on: true; threshold: 15; };
    hiresscroll: { hires: true; invert: false; target: false; };
    dpi: 1500;

    buttons: (
    {
        cid: 0xc3; // gesture (thumb) button
        action = {
            type: "Gestures";
            gestures: (
                { direction: "None";  mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_LEFTMETA"]; }; },
                { direction: "Up";    mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_LEFTMETA"]; }; },
                { direction: "Down";  mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_LEFTMETA"]; }; },
                { direction: "Left";  mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_LEFTCTRL", "KEY_LEFTALT", "KEY_RIGHT"]; }; },
                { direction: "Right"; mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_LEFTCTRL", "KEY_LEFTALT", "KEY_LEFT"]; }; }
            );
        };
    }
    );
}
);
